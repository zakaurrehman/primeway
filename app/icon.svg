<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prime Way Capital">
  <defs>
    <linearGradient id="pwBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2d7ff9"/>
      <stop offset="0.55" stop-color="#1657c4"/>
      <stop offset="1" stop-color="#0b2545"/>
    </linearGradient>
    <linearGradient id="pwGold" x1="120" y1="360" x2="372" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3d68f"/>
      <stop offset="1" stop-color="#d8a93c"/>
    </linearGradient>
    <radialGradient id="pwSheen" cx="0.28" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Brand tile -->
  <rect width="512" height="512" rx="120" fill="url(#pwBg)"/>
  <rect width="512" height="512" rx="120" fill="url(#pwSheen)"/>

  <!-- Ascending bars (capital / growth) -->
  <g fill="#ffffff" opacity="0.92">
    <rect x="132" y="314" width="58" height="72" rx="16"/>
    <rect x="216" y="262" width="58" height="124" rx="16"/>
    <rect x="300" y="210" width="58" height="176" rx="16"/>
  </g>

  <!-- Upward trend arrow -->
  <g stroke="url(#pwGold)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M138 356 L360 176"/>
    <path d="M298 176 L360 176 L360 238"/>
  </g>
</svg>
